name: live

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  probe:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        lane:
          - googleapis/dict-chrome-ex
          - googleapis/at
          - clients5/dict-chrome-ex
          - clients5/at
          - google.com/dict-chrome-ex
          - google.com/at
          - googleapis/t/dict-chrome-ex
          - googleapis/t/at
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: safe
        env:
          LANE: ${{ matrix.lane }}
        run: echo "name=$(echo "$LANE" | sed 's/[/.-]/_/g')" >> "$GITHUB_OUTPUT"
      - id: probe
        continue-on-error: true
        run: cargo test --test live_tests -- --ignored --exact "lane_${{ steps.safe.outputs.name }}"
      - name: badge
        env:
          LANE: ${{ matrix.lane }}
          SAFE: ${{ steps.safe.outputs.name }}
          OUTCOME: ${{ steps.probe.outcome }}
        run: |
          mkdir -p status
          if [ "$OUTCOME" = success ]; then message=up; color=brightgreen; else message=down; color=red; fi
          printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' "$LANE" "$message" "$color" > "status/$SAFE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: lane-${{ steps.safe.outputs.name }}
          path: status/
      - name: report
        if: steps.probe.outcome != 'success'
        run: exit 1

  status:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lane-*
          merge-multiple: true
          path: status
      - id: tally
        run: |
          total=$(ls status/*.json | wc -l)
          up=$(cat status/*.json | grep -c '"message":"up"' || true)
          if [ "$up" -eq "$total" ]; then color=brightgreen; elif [ "$up" -gt 0 ]; then color=yellow; else color=red; fi
          printf '{"schemaVersion":1,"label":"google lanes","message":"%s/%s up","color":"%s"}\n' "$up" "$total" "$color" > status/overall.json
          echo "up=$up" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
      - name: publish status branch
        env:
          UP: ${{ steps.tally.outputs.up }}
          TOTAL: ${{ steps.tally.outputs.total }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd status
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "status: $UP/$TOTAL lanes up at $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/status
      - name: commit status
        env:
          UP: ${{ steps.tally.outputs.up }}
          TOTAL: ${{ steps.tally.outputs.total }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$UP" -gt 0 ]; then state=success; else state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="live/google" \
            -f description="$UP/$TOTAL lanes up" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
