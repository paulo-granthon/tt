name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - target: aarch64-linux
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: x86_64-macos
            os: macos-latest
            rust_target: x86_64-apple-darwin
          - target: aarch64-macos
            os: macos-latest
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - run: cargo build --release --target ${{ matrix.rust_target }}
      - name: package
        env:
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          staging="tt-$TARGET"
          mkdir -p "$staging/completions"
          cp "target/$RUST_TARGET/release/tt" "$staging/"
          cp completions/tt.bash completions/_tt completions/tt.fish "$staging/completions/"
          tar -czf "tt-$TARGET.tar.gz" -C "$staging" .
      - id: built
        run: echo "at=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
      - name: upload rolling latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest (rolling)
          prerelease: true
          body: >
            Rolling build of the newest commit on main. Commit ${{ github.sha }},
            built ${{ steps.built.outputs.at }}. For a pinned build see the versioned
            releases.
          files: tt-${{ matrix.target }}.tar.gz
      - name: upload versioned release
        if: needs.version.outputs.is_new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: tt-${{ matrix.target }}.tar.gz

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish if version changed
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "no CARGO_REGISTRY_TOKEN, skipping crates.io publish"
            exit 0
          fi
          meta=$(cargo metadata --no-deps --format-version 1)
          name=$(echo "$meta" | jq -r '.packages[0].name')
          version=$(echo "$meta" | jq -r '.packages[0].version')
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "$name-ci" "https://crates.io/api/v1/crates/$name/$version")
          if [ "$code" = "200" ]; then
            echo "$name $version already on crates.io, skipping"
          else
            cargo publish
          fi
